[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-contract_review"
version = "2.0.0"
description = "Interactive legal contract review environment for AI agent evaluation"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
server = "contract_review.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["contract_review", "contract_review.server", "contract_review.contracts", "contract_review.tasks"]
package-dir = { "contract_review" = ".", "contract_review.server" = "server", "contract_review.contracts" = "contracts", "contract_review.tasks" = "tasks" }
